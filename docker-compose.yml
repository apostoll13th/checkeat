version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: checkeat_postgres
    environment:
      POSTGRES_DB: checkeat_db
      POSTGRES_USER: checkeat_user
      POSTGRES_PASSWORD: checkeat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkeat_user -d checkeat_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkeat-network

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: checkeat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkeat-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkeat_backend
    environment:
      - DATABASE_URL=postgresql://checkeat_user:checkeat_password@postgres:5432/checkeat_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-this}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this}
      - DEBUG=True
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - checkeat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Android APK Builder
  android-builder:
    build:
      context: ./android
      dockerfile: Dockerfile
    container_name: checkeat_android_builder
    volumes:
      - ./android:/app
      - android_build_cache:/root/.gradle
      - android_apk_output:/app/app/build/outputs
    environment:
      - GRADLE_OPTS=-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4
    networks:
      - checkeat-network
    # Этот сервис запускается только при явном вызове
    profiles:
      - build

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  android_build_cache:
  android_apk_output:

networks:
  checkeat-network:
    driver: bridge
