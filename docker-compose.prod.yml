version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: checkeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-checkeat}
      POSTGRES_USER: ${DB_USER:-checkeat_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    networks:
      - checkeat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-checkeat_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: checkeat-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    networks:
      - checkeat-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKERHUB_USERNAME}/checkeat-backend:latest
    container_name: checkeat-backend
    restart: unless-stopped
    environment:
      # Основные настройки
      APP_NAME: CheckEat API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # База данных
      DATABASE_URL: postgresql://${DB_USER:-checkeat_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-checkeat}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Безопасность
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Production режим
      ENVIRONMENT: production
      DEBUG: "false"

      # Лимиты
      MAX_UPLOAD_SIZE: 10485760  # 10MB

    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - checkeat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: checkeat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
    networks:
      - checkeat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  checkeat-network:
    driver: bridge
